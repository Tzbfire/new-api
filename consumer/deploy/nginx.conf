# Replace the existing frontend location / in the HTTPS server block.
# Keep more-specific API, relay and webhook proxy locations as configured.
# The Go gateway chooses consumer or legacy HTML before a page is loaded.
# Do not serve index.html through an unconditional nginx SPA fallback.
#
# Gateway environment (paths inside the gateway host/container):
# CONSUMER_FRONTEND_DIR=/srv/new-api/releases/current
# CONSUMER_FRONTEND_PREVIOUS_DIRS=/srv/new-api/releases/previous
# LEGACY_FRONTEND_PREVIOUS_DIRS=/srv/new-api/legacy/previous
# BIND_HOST=127.0.0.1 (when nginx and the gateway share the host)
#
# Copy independent consumer build files to a versioned directory and switch
# "current" atomically. Retain previous hashed files for open browser tabs.
# Keep the public domain, SESSION_SECRET, CRYPTO_SECRET and existing cookie
# settings unchanged during a frontend-only rollout. New and old callbacks
# remain available at their original paths, including /app/oauth/*.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 600s;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
# For an existing HTTPS installation preserve the exact trusted origin and
# secure cookie settings; never widen CORS to make a frontend switch work.
