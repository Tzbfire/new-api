name: Fork CI

on:
  push:
    branches:
      - 'integrate/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: (github.repository == 'manyou116/new-api' || github.repository == 'Tzbfire/new-api')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare embedded frontend assets
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Test
        run: |
          go test ./...
          (cd relaykit && GOWORK=off go build ./...)
          (cd tokenkit && GOWORK=off go build ./...)

  frontend:
    if: (github.repository == 'manyou116/new-api' || github.repository == 'Tzbfire/new-api')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test --maxWorkers=2
      - run: bun run build

  database:
    if: (github.repository == 'manyou116/new-api' || github.repository == 'Tzbfire/new-api')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, postgres]
        mode: [fresh, upgrade]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: merge-test-only
          MYSQL_DATABASE: newapi_merge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmerge-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: merge-test-only
          POSTGRES_DB: newapi_merge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      NEWAPI_TEST_DB: ${{ matrix.database }}
      NEWAPI_TEST_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure disposable database
        run: |
          case "$NEWAPI_TEST_DB" in
            sqlite) echo "NEWAPI_TEST_DSN=$RUNNER_TEMP/newapi-merge.db" >> "$GITHUB_ENV" ;;
            mysql) echo 'NEWAPI_TEST_DSN=root:merge-test-only@tcp(127.0.0.1:3306)/newapi_merge?charset=utf8mb4&parseTime=True&loc=Local' >> "$GITHUB_ENV" ;;
            postgres) echo 'NEWAPI_TEST_DSN=host=127.0.0.1 user=postgres password=merge-test-only dbname=newapi_merge port=5432 sslmode=disable' >> "$GITHUB_ENV" ;;
          esac
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Seed database with previous fork revision
        if: matrix.mode == 'upgrade'
        run: scripts/test-manyou-upgrade.sh
      - name: Verify startup twice and preserve old balances
        run: go test ./model -run '^TestQuotaBucketStartupMigrationCompatibility$' -count=1
      - name: Verify bucket accounting and affiliate rebates
        run: go test ./model -run 'Test(QuotaBucket|CreditUserQuotaBucket|DebitUserQuotaBuckets|PurchaseSubscriptionWithWallet|PurchaseSubscriptionWithBalanceDelegates|AffiliateUsageRebate)' -count=1

  container:
    if: (github.repository == 'manyou116/new-api' || github.repository == 'Tzbfire/new-api')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=fork-ci-amd64
          cache-to: type=gha,mode=max,scope=fork-ci-amd64
